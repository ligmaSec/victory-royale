[project]
name = "security-audit-worker"
version = "0.1.0"
description = "Mistral Workflows worker that statically audits pull request diffs and publishes a GitHub check run on the PR head commit"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mistralai-workflows[mistralai]>=3.17.1",
    "pydantic>=2.14.1",
    "httpx>=0.28.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
