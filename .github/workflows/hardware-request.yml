name: Prepare a hardware test kit

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      requester_comment:
        description: "Publishing for someone else? Link their /victory hardware-test comment on this PR"
        required: false
        type: string
      console:
        description: Console profile for both launches
        type: choice
        default: series-x
        options:
          - series-x
          - series-s
      stop_after:
        description: End each build after this runtime milestone and observation period
        type: choice
        default: device-ready
        options: [device-ready, present-1024, first-mesh-bind, manual]
      observe_seconds:
        description: Seconds to observe after reaching the milestone
        default: "180"
        type: string
      timeout_seconds:
        description: Maximum seconds per build including startup
        default: "900"
        type: string
      scenario:
        description: What to do in each run and when to close it
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require the publication branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Choose main in Run workflow. The tester menu only discovers kits published from main."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the project cross toolchain
        run: |
          bash .github/scripts/install-tools.sh cross
          rustup target add x86_64-unknown-linux-musl x86_64-pc-windows-gnullvm
      - name: Build the offline report editor for Linux and Windows
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          cargo build --locked --release -p victory-report-review --target x86_64-unknown-linux-musl --target x86_64-pc-windows-gnullvm
          mkdir "$RUNNER_TEMP/review"
          cp target/x86_64-unknown-linux-musl/release/victory-report-review "$RUNNER_TEMP/review/"
          cp target/x86_64-pc-windows-gnullvm/release/victory-report-review.exe "$RUNNER_TEMP/review/"
      - name: Match and verify both CI builds
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTER_COMMENT: ${{ inputs.requester_comment }}
          PR: ${{ inputs.pr }}
          CONSOLE: ${{ inputs.console }}
          STOP_AFTER: ${{ inputs.stop_after }}
          OBSERVE: ${{ inputs.observe_seconds }}
          TIMEOUT: ${{ inputs.timeout_seconds }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          python3 scripts/hardware-test/prepare.py "$PR" --console "$CONSOLE" --scenario "$SCENARIO" --stop-after "$STOP_AFTER" --observe-seconds "$OBSERVE" --timeout-seconds "$TIMEOUT" --published --requester-comment "$REQUESTER_COMMENT" --review-dir "$RUNNER_TEMP/review" --output "$RUNNER_TEMP/kit.zip"
          unzip -q "$RUNNER_TEMP/kit.zip" -d "$RUNNER_TEMP/kit"
      - name: Publish the test kit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: victory-${{ inputs.console }}-pr-${{ inputs.pr }}
          path: ${{ runner.temp }}/kit/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
