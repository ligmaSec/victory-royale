name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every integrated revision gets a result and a package, even across back-to-back merges.
  # A newer commit on the same PR can still supersede its previous CI run.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-policy:
    name: fmt-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      route: ${{ steps.route.outputs.route }}
      tree: ${{ steps.route.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine required jobs
        id: route
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ci-route.sh
      - name: Install the toolchain
        run: rustup toolchain install
      - name: Validate workflows and shell scripts
        if: steps.route.outputs.route != 'docs'
        run: |
          bash .github/scripts/install-tools.sh lint
          "$RUNNER_TEMP/actionlint-bin/actionlint"
          git ls-files -z -- '*.sh' | xargs -0 -r shellcheck
          bash tests/ci-route.sh
      - name: Documentation layout
        run: bash tests/docs.sh
      - name: Check the formatting
        if: steps.route.outputs.route != 'docs'
        run: cargo fmt --all -- --check
      - name: Asset policy
        run: cargo xtask policy

  check:
    needs: fmt-policy
    if: needs.fmt-policy.outputs.route != 'docs'
    name: check
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Hardware test kit (synthetic)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VICTORY_TEST_AGE: "1"
        run: |
          python -B tests/hardware-test.py
          python -B tests/hardware-delivery.py
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # GPU tests share D3D12/WARP driver state; parallel test processes can crash on AMD (#181).
      # Keep the workspace test run deterministic across Windows GPU/driver configurations.
      - name: Tests
        run: cargo test --workspace --locked -- --test-threads=1

  msrv:
    needs: fmt-policy
    if: needs.fmt-policy.outputs.route == 'code'
    name: msrv / ${{ github.event.pull_request.number || github.event_name }} / ${{ needs.fmt-policy.outputs.tree }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workspace on the declared minimum
        shell: bash
        run: |
          msrv=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --workspace --all-targets --all-features --locked

  # The portable crates build and test on Linux too; this catches
  # Windows-only code reaching them.
  linux:
    needs: fmt-policy
    if: needs.fmt-policy.outputs.route != 'docs'
    name: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Hardware test kit (synthetic)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VICTORY_TEST_AGE: "1"
        run: |
          python -B tests/hardware-test.py
          python -B tests/hardware-delivery.py
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Optional build-time shader compiler
        run: bash tests/build-dxc.sh
      - name: Proton launcher (synthetic, no Wine)
        run: bash tests/proton-launcher.sh

  proton:
    needs: [fmt-policy, check, msrv, linux]
    if: >-
      !cancelled() && needs.fmt-policy.result == 'success' &&
      needs.check.result == 'success' && needs.linux.result == 'success' &&
      ((needs.fmt-policy.outputs.route == 'code' && needs.msrv.result == 'success') ||
       (needs.fmt-policy.outputs.route == 'verified-msrv' && needs.msrv.result == 'skipped'))
    uses: ./.github/workflows/proton.yml

  gate:
    name: Regression gate
    if: always()
    needs: [fmt-policy, check, msrv, linux, proton]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the expected jobs to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          jobs = json.loads(os.environ["RESULTS"])
          policy = jobs["fmt-policy"]
          if policy["result"] != "success":
              raise SystemExit(f"fmt-policy ended with {policy['result']} before the CI route could be verified")
          route = policy["outputs"].get("route")
          if route not in {"docs", "code", "verified-msrv"}:
              raise SystemExit(f"Unknown CI route: {route}")
          for name in ("fmt-policy", "check", "linux", "msrv", "proton"):
              required = name == "fmt-policy" or (route != "docs" and (name != "msrv" or route == "code"))
              expected = "success" if required else "skipped"
              actual = jobs[name]["result"]
              if actual != expected:
                  raise SystemExit(f"{name}: expected {expected}, got {actual}")
          print(f"All checks for {route} passed.")
          PYTHON
