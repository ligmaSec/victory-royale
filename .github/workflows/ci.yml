name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-policy:
    name: fmt-policy
    # rustfmt does not compile code, so a Linux runner can check the
    # Windows-only crates.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Installs the toolchain that rust-toolchain.toml gives, with its
      # components, so CI uses the same rustfmt as local builds.
      - name: Install the toolchain
        run: rustup toolchain install
      - name: Check the formatting
        run: cargo fmt --all -- --check
      - name: Asset policy
        run: cargo xtask policy

  check:
    name: check
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # GPU tests share D3D12/WARP driver state; parallel test processes can crash on AMD (#181).
      # Keep the workspace test run deterministic across Windows GPU/driver configurations.
      - name: Tests
        run: cargo test --workspace --locked -- --test-threads=1

  msrv:
    name: msrv
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # Keep this version in sync with workspace.package.rust-version.
      - name: Install minimum Rust toolchain
        run: rustup toolchain install 1.88.0
      - name: Check workspace on the declared minimum
        run: cargo +1.88.0 check --workspace --locked

  # The portable crates build and test on Linux too; this catches
  # Windows-only code reaching them.
  linux:
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Proton launcher (synthetic, no Wine)
        run: bash tests/proton-launcher.sh
